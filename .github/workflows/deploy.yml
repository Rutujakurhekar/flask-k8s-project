name: Build and Deploy to Kubernetes

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and Push Docker image
      run: |
        docker build -t rutujakurhekar/flask-k8s-app:${{ github.sha }} ./app
        docker push rutujakurhekar/flask-k8s-app:${{ github.sha }}

    - name: Update deployment image
      run: |
        sed -i 's|rutujakurhekar/flask-k8s-app:.*|rutujakurhekar/flask-k8s-app:${{ github.sha }}|g' k8s/flask-deployment.yaml

    - name: Commit updated manifest
      run: |
        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"
        git add k8s/flask-deployment.yaml
        git commit -m "Update image to ${{ github.sha }}" || exit 0
        git push
