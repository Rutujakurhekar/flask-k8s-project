name: Build and Deploy to Kubernetes

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and Push Docker image
      run: |
        docker build -t rutujakurhekar/flask-k8s-app:${{ github.sha }} ./app
        docker push rutujakurhekar/flask-k8s-app:${{ github.sha }}
        docker tag rutujakurhekar/flask-k8s-app:${{ github.sha }} rutujakurhekar/flask-k8s-app:latest
        docker push rutujakurhekar/flask-k8s-app:latest

    - name: Update Kubernetes manifest
      run: |
        sed -i 's|rutujakurhekar/flask-k8s-app:.*|rutujakurhekar/flask-k8s-app:${{ github.sha }}|g' k8s/flask-deployment.yaml

    - name: Commit updated manifest
      run: |
        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"
        git add k8s/flask-deployment.yaml
        git commit -m "ci: update image to ${{ github.sha }}" || exit 0
        git push

    - name: Deployment Summary
      run: |
        echo "============================================"
        echo "DEPLOYMENT SUMMARY"
        echo "============================================"
        echo "Image: rutujakurhekar/flask-k8s-app:${{ github.sha }}"
        echo "Status: Image built and pushed to Docker Hub"
        echo "Manifest: k8s/flask-deployment.yaml updated"
        echo "Next: kubectl apply -f k8s/flask-deployment.yaml"
        echo "============================================"
